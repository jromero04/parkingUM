services:
  usuarios:
    environment:
      ADMIN_NAME: Integration Admin
      ADMIN_EMAIL: admin-integration@example.com
      ADMIN_PASSWORD: integration-admin-password
      NOTIFICATIONS_SERVICE_TOKEN: integration-notifications-token
  notificaciones-worker:
    environment:
      NOTIFICATIONS_SERVICE_TOKEN: integration-notifications-token
  sensores:
    environment:
      REPORT_INTERVAL_SECONDS: "1"
  parkings:
    ports:
      - "18001:8000"
    environment:
      SENSOR_FRESH_SECONDS: "300"
      RESERVATIONS_SERVICE_TOKEN: integration-reservations-token
    networks: [backend, edge]
  parkings-sensor-worker:
    environment:
      SENSOR_FRESH_SECONDS: "300"
  reservas:
    ports:
      - "18002:8000"
    environment:
      RECOVERY_POLL_SECONDS: "1"
      RESERVATIONS_SERVICE_TOKEN: integration-reservations-token
  reservas-recovery-worker:
    environment:
      RECOVERY_POLL_SECONDS: "1"
      RESERVATIONS_SERVICE_TOKEN: integration-reservations-token
