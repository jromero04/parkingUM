events {}

http {
    log_format json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"gateway",'
        '"instance_id":"$hostname","action":"http_completed","result":"$status",'
        '"correlation_id":"$correlation_id","http_method":"$request_method",'
        '"path":"$uri","status_code":$status,"duration_ms":$request_time}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    map $request_id $generated_correlation_id {
        ~^(........)(....)(....)(....)(............)$ $1-$2-$3-$4-$5;
        default "00000000-0000-4000-8000-000000000000";
    }

    map $http_x_correlation_id $client_correlation_id {
        ~*^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ $http_x_correlation_id;
        default "";
    }

    map $client_correlation_id $correlation_id {
        "" $generated_correlation_id;
        default $client_correlation_id;
    }

    upstream usuarios_api {
        server usuarios:8000;
    }

    upstream parkings_api {
        server parkings:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        location /api/v1/usuarios/ {
            proxy_pass http://usuarios_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Service-Token "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 = @upstream_error;
            error_page 504 = @upstream_timeout;
        }

        location = /api/v1/parkings {
            proxy_pass http://parkings_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Service-Token "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 = @upstream_error;
            error_page 504 = @upstream_timeout;
        }

        location /api/v1/parkings/ {
            proxy_pass http://parkings_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Service-Token "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 = @upstream_error;
            error_page 504 = @upstream_timeout;
        }

        location @upstream_error {
            default_type application/json;
            add_header X-Correlation-ID $correlation_id always;
            return 502 '{"error":{"code":"UPSTREAM_ERROR","message":"El servicio no esta disponible.","details":{}},"correlation_id":"$correlation_id"}';
        }

        location @upstream_timeout {
            default_type application/json;
            add_header X-Correlation-ID $correlation_id always;
            return 504 '{"error":{"code":"UPSTREAM_TIMEOUT","message":"El servicio no respondio a tiempo.","details":{}},"correlation_id":"$correlation_id"}';
        }

        location / {
            default_type application/json;
            add_header X-Correlation-ID $correlation_id always;
            return 404 '{"error":{"code":"RESOURCE_NOT_FOUND","message":"Recurso inexistente.","details":{}},"correlation_id":"$correlation_id"}';
        }
    }
}

