name: estacionamiento-inteligente

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usuarios_db}
      POSTGRES_USER: ${POSTGRES_USER:-usuarios_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  parkings-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PARKINGS_POSTGRES_DB:-parkings_db}
      POSTGRES_USER: ${PARKINGS_POSTGRES_USER:-parkings_app}
      POSTGRES_PASSWORD: ${PARKINGS_POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - parkings-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  reservas-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESERVAS_POSTGRES_DB:-reservas_db}
      POSTGRES_USER: ${RESERVAS_POSTGRES_USER:-reservas_app}
      POSTGRES_PASSWORD: ${RESERVAS_POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - reservas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  metricas-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${METRICAS_POSTGRES_DB:-metricas_db}
      POSTGRES_USER: ${METRICAS_POSTGRES_USER:-metricas_app}
      POSTGRES_PASSWORD: ${METRICAS_POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - metricas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  notificaciones-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_POSTGRES_DB:-notificaciones_db}
      POSTGRES_USER: ${NOTIFICACIONES_POSTGRES_USER:-notificaciones_app}
      POSTGRES_PASSWORD: ${NOTIFICACIONES_POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - notificaciones-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-parking_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-only-rabbit-password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: *default-logging

  usuarios:
    build:
      context: ./services/usuarios
    environment:
      SERVICE_NAME: usuarios
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://usuarios_app:dev-only-password@postgres:5432/usuarios_db}
      JWT_ISSUER: ${JWT_ISSUER:-parking-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-parking-api}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-3600}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/run/parking-keys/private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/parking-keys/public.pem}
      NOTIFICATIONS_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:-dev-only-notifications-token}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SENSOR_NAME: ${SENSOR_NAME:-}
      SENSOR_EMAIL: ${SENSOR_EMAIL:-}
      SENSOR_PASSWORD: ${SENSOR_PASSWORD:-}
    volumes:
      - jwt-keys:/run/parking-keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  parkings:
    build:
      context: ./services/parkings
    environment:
      SERVICE_NAME: parkings
      DATABASE_URL: ${PARKINGS_DATABASE_URL:-postgresql+psycopg://parkings_app:dev-only-password@parkings-db:5432/parkings_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
      JWT_ISSUER: ${JWT_ISSUER:-parking-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-parking-api}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/parking-keys/public.pem}
      RESERVATIONS_SERVICE_TOKEN: ${RESERVATIONS_SERVICE_TOKEN:-dev-only-reservations-token}
      SENSOR_FRESH_SECONDS: ${SENSOR_FRESH_SECONDS:-15}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - jwt-keys:/run/parking-keys:ro
    depends_on:
      parkings-db:
        condition: service_healthy
      usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  parkings-sensor-worker:
    build:
      context: ./services/parkings
    command: ["python", "-m", "app.sensor_worker"]
    environment:
      SERVICE_NAME: parkings-sensors
      DATABASE_URL: ${PARKINGS_DATABASE_URL:-postgresql+psycopg://parkings_app:dev-only-password@parkings-db:5432/parkings_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
      SENSOR_FRESH_SECONDS: ${SENSOR_FRESH_SECONDS:-15}
    depends_on:
      parkings:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  parkings-outbox-worker:
    build:
      context: ./services/parkings
    command: ["python", "-m", "app.outbox_worker"]
    environment:
      SERVICE_NAME: parkings-outbox
      DATABASE_URL: ${PARKINGS_DATABASE_URL:-postgresql+psycopg://parkings_app:dev-only-password@parkings-db:5432/parkings_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
    depends_on:
      parkings:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  reservas:
    build:
      context: ./services/reservas
      target: runtime
    environment:
      SERVICE_NAME: reservas
      DATABASE_URL: ${RESERVAS_DATABASE_URL:-postgresql+psycopg://reservas_app:dev-only-password@reservas-db:5432/reservas_db}
      PARKINGS_URL: http://parkings:8000
      RESERVATIONS_SERVICE_TOKEN: ${RESERVATIONS_SERVICE_TOKEN:-dev-only-reservations-token}
      JWT_ISSUER: ${JWT_ISSUER:-parking-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-parking-api}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/parking-keys/public.pem}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
      RECOVERY_POLL_SECONDS: ${RECOVERY_POLL_SECONDS:-5}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - jwt-keys:/run/parking-keys:ro
    depends_on:
      reservas-db:
        condition: service_healthy
      usuarios:
        condition: service_healthy
      parkings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  reservas-recovery-worker:
    build:
      context: ./services/reservas
      target: runtime
    command: ["python", "-m", "app.recovery_worker"]
    environment:
      SERVICE_NAME: reservas-recovery
      DATABASE_URL: ${RESERVAS_DATABASE_URL:-postgresql+psycopg://reservas_app:dev-only-password@reservas-db:5432/reservas_db}
      PARKINGS_URL: http://parkings:8000
      RESERVATIONS_SERVICE_TOKEN: ${RESERVATIONS_SERVICE_TOKEN:-dev-only-reservations-token}
      RECOVERY_POLL_SECONDS: ${RECOVERY_POLL_SECONDS:-5}
    depends_on:
      reservas:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "WORKER_MODULE=app.recovery_worker python scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  reservas-outbox-worker:
    build:
      context: ./services/reservas
      target: runtime
    command: ["python", "-m", "app.outbox_worker"]
    environment:
      SERVICE_NAME: reservas-outbox
      DATABASE_URL: ${RESERVAS_DATABASE_URL:-postgresql+psycopg://reservas_app:dev-only-password@reservas-db:5432/reservas_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
    depends_on:
      reservas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "WORKER_MODULE=app.outbox_worker python scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  reservas-parking-worker:
    build:
      context: ./services/reservas
      target: runtime
    command: ["python", "-m", "app.parking_worker"]
    environment:
      SERVICE_NAME: reservas-parking
      DATABASE_URL: ${RESERVAS_DATABASE_URL:-postgresql+psycopg://reservas_app:dev-only-password@reservas-db:5432/reservas_db}
      PARKINGS_URL: http://parkings:8000
      RESERVATIONS_SERVICE_TOKEN: ${RESERVATIONS_SERVICE_TOKEN:-dev-only-reservations-token}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
    depends_on:
      reservas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "WORKER_MODULE=app.parking_worker python scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  metricas:
    build:
      context: ./services/metricas
      target: runtime
    environment:
      SERVICE_NAME: metricas
      DATABASE_URL: ${METRICAS_DATABASE_URL:-postgresql+psycopg://metricas_app:dev-only-password@metricas-db:5432/metricas_db}
      JWT_ISSUER: ${JWT_ISSUER:-parking-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-parking-api}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/parking-keys/public.pem}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - jwt-keys:/run/parking-keys:ro
    depends_on:
      metricas-db:
        condition: service_healthy
      usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  metricas-worker:
    build:
      context: ./services/metricas
      target: runtime
    command: ["python", "-m", "app.worker"]
    environment:
      SERVICE_NAME: metricas-worker
      DATABASE_URL: ${METRICAS_DATABASE_URL:-postgresql+psycopg://metricas_app:dev-only-password@metricas-db:5432/metricas_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
    depends_on:
      metricas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  notificaciones-worker:
    build:
      context: ./services/notificaciones
      target: runtime
    environment:
      SERVICE_NAME: notificaciones-worker
      DATABASE_URL: ${NOTIFICACIONES_DATABASE_URL:-postgresql+psycopg://notificaciones_app:dev-only-password@notificaciones-db:5432/notificaciones_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
      USUARIOS_URL: http://usuarios:8000
      NOTIFICATIONS_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:-dev-only-notifications-token}
    depends_on:
      notificaciones-db:
        condition: service_healthy
      usuarios:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  sensores:
    build:
      context: ./services/sensores
      target: runtime
    environment:
      SERVICE_NAME: sensores
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking_app:dev-only-rabbit-password@rabbitmq:5672/%2F}
      STATE_DB_PATH: /data/sensors.db
      SENSOR_ID: ${SIMULATOR_SENSOR_ID:-33333333-3333-4333-8333-333333333333}
      SPOT_ID: ${SIMULATOR_SPOT_ID:-22222222-2222-4222-8222-222222222222}
      REPORT_INTERVAL_SECONDS: ${SENSOR_REPORT_INTERVAL_SECONDS:-5}
      SIMULATOR_ENABLED: ${SENSOR_SIMULATOR_ENABLED:-true}
      SIMULATE_FULL_PARKING: ${SIMULATE_FULL_PARKING:-true}
      START_PUBLISHER: "true"
      JWT_ISSUER: ${JWT_ISSUER:-parking-users}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-parking-api}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/parking-keys/public.pem}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - sensor-state:/data
      - jwt-keys:/run/parking-keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      parkings-sensor-worker:
        condition: service_healthy
      usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      usuarios:
        condition: service_healthy
      parkings:
        condition: service_healthy
      reservas:
        condition: service_healthy
      metricas:
        condition: service_healthy
      sensores:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [backend, edge]
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [backend, edge]
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.21.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    user: "0"
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./infra/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks: [backend, edge]
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    networks: [backend, edge]
    logging: *default-logging

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  parkings-postgres-data:
  reservas-postgres-data:
  metricas-postgres-data:
  notificaciones-postgres-data:
  sensor-state:
  rabbitmq-data:
  jwt-keys:
  loki-data:
  alloy-data:
  grafana-data:

